<script>

function catOf(r){const n=String(r.name||"").toUpperCase();const lat=Math.abs(parseFloat(r.lat||"0"));if(lat>3)return ["#dd6b20","移動中・傾斜大","GEO付近だが南北に大きく振れている。移動中・静止化途中・傾斜軌道の可能性"];if(n.includes("TJS")||n.includes("TONGXIN"))return ["#2b6cb0","TJS・通信技術試験","中国の通信技術試験衛星系。GEO上の位置と移動を継続監視"];if(n.includes("CHINASAT")||n.includes("ZHONGXING")||n.includes("ZX-")||n.includes("TIANLIAN")||n.includes("APSTAR"))return ["#c53030","PRC通信・中継","中国系の通信・データ中継衛星候補"];if(n.includes("LUCH")||n.includes("EXPRESS")||n.includes("EKSPRESS")||n.includes("YAMAL")||n.includes("RADUGA")||n.includes("GARPUN"))return ["#6b46c1","CIS/Russia系","ロシア・旧ソ連系の通信またはデータ中継衛星候補"];if(n.includes("ELEKTRO")||n.includes("HIMAWARI")||n.includes("GOES")||n.includes("METEOSAT")||n.includes("FENGYUN")||n.includes("FY-"))return ["#2f855a","気象・観測","静止気象・地球観測系"];return ["#718096","未整理","用途未整理。公開情報または自分メモで追記"];}function popOf(r){const c=catOf(r);return "<b>"+r.name+"</b><br><span style='display:inline-block;margin:4px 0;padding:2px 8px;border-radius:10px;background:"+c[0]+";color:white;font-size:12px;'>"+c[1]+"</span><br>NORAD "+r.norad+"<br>Lat "+r.lat+"<br>Lon "+r.lon+"<br>Alt km "+r.alt_km+"<br><hr><b>分類:</b> "+c[1]+"<br><b>任務メモ:</b> "+c[2];}data.forEach(r=>{const c=catOf(r);L.circleMarker([parseFloat(r.lat),parseFloat(r.lon)],{radius:8,color:"#1a202c",weight:1,fillColor:c[0],fillOpacity:0.9}).addTo(map).bindPopup(popOf(r));});const legend=L.control({position:"bottomleft"});legend.onAdd=function(){const div=L.DomUtil.create("div","info legend");div.style.background="white";div.style.padding="10px";div.style.borderRadius="8px";div.style.boxShadow="0 1px 5px rgba(0,0,0,0.3)";div.style.fontSize="13px";div.innerHTML="<b>衛星カテゴリ</b><br><div>🔵 TJS・通信技術試験</div><div>🔴 PRC通信・中継</div><div>🟣 CIS/Russia系</div><div>🟢 気象・観測</div><div>🟠 移動中・傾斜大</div><div>⚫ 未整理</div>";return div;};legend.addTo(map);
