/* =========================================================
   打上げ場所
   ========================================================= */

const LAUNCH_SITES = {

    // 中国
    "WSC": "文昌衛星発射場",
    "XICLF": "西昌衛星発射センター",
    "JSC": "酒泉衛星発射センター",
    "TAISC": "太原衛星発射センター",
    "SCSLA": "南シナ海打上げ区域",
    "YSLA": "黄海打上げ区域",

    // ロシア・旧ソ連圏
    "DLS": "ドンバロフスキー発射場",
    "PLMSC": "プレセツク宇宙基地",
    "KYMSC": "カプースチン・ヤール",

    "TYMSC": "バイコヌール宇宙基地",

    // その他
    "SEAL": "シーローンチ海上発射施設",
    "SUBL": "潜水艦発射",
    "UNK": "不明"
};



function launchSiteName(code) {

    if (!code) {
        return "不明";
    }

    const key =
        String(code)
            .trim()
            .toUpperCase();

    const name =
        LAUNCH_SITES[key];

    if (name) {

        return (
            name +
            "（" +
            key +
            "）"
        );
    }

    return key;
}



/* =========================================================
   衛星カテゴリ
   ========================================================= */

function catOf(r) {

    const n =
        String(
            r.name || ""
        ).toUpperCase();

    const lat =
        Math.abs(
            parseFloat(
                r.lat || "0"
            )
        );


    if (lat > 3) {

        return [
            "#dd6b20",
            "移動中・傾斜大",
            "GEO付近だが南北に大きく振れている。移動中・静止化途中・傾斜軌道の可能性"
        ];
    }


    if (
        n.includes("TJS") ||
        n.includes("TONGXIN")
    ) {

        return [
            "#2b6cb0",
            "TJS・通信技術試験",
            "中国の通信技術試験衛星系。GEO上の位置と移動を継続監視"
        ];
    }


    return [
        "#718096",
        "未整理",
        "用途未整理。公開情報または自分メモで追記"
    ];
}



/* =========================================================
   打上げ情報
   ========================================================= */

function formatLaunchDate(date) {

    if (!date) {
        return "不明";
    }

    return date.replaceAll(
        "-",
        "/"
    );
}



function launchAgeOf(date) {

    if (!date) {
        return "不明";
    }

    const launch =
        new Date(
            date +
            "T00:00:00Z"
        );


    if (
        Number.isNaN(
            launch.getTime()
        )
    ) {
        return "不明";
    }


    const diff =
        Date.now() -
        launch.getTime();


    if (diff < 0) {
        return "未打上げ";
    }


    const days =
        Math.floor(
            diff / 86400000
        );


    if (days < 365) {
        return days + "日";
    }


    const years =
        Math.floor(
            days / 365.2425
        );


    const remainDays =
        Math.floor(
            days -
            years * 365.2425
        );


    return (
        years +
        "年 " +
        remainDays +
        "日"
    );
}



/* =========================================================
   TLE経過時間
   ========================================================= */

function ageOf(epochIso) {

    const epoch =
        new Date(
            epochIso
        );


    if (
        Number.isNaN(
            epoch.getTime()
        )
    ) {
        return "不明";
    }


    let diff =
        Date.now() -
        epoch.getTime();


    const future =
        diff < 0;


    diff =
        Math.abs(diff);


    const totalMinutes =
        Math.floor(
            diff / 60000
        );


    const days =
        Math.floor(
            totalMinutes / 1440
        );


    const hours =
        Math.floor(
            (totalMinutes % 1440) / 60
        );


    const minutes =
        totalMinutes % 60;


    let text = "";


    if (days > 0) {

        text +=
            days +
            "日 ";
    }


    text +=
        hours +
        "時間" +
        minutes +
        "分";


    return future
        ? "未来 " + text
        : text;
}



/* =========================================================
   TLE鮮度
   ========================================================= */

function freshnessOf(epochIso) {

    const epoch =
        new Date(
            epochIso
        );


    if (
        Number.isNaN(
            epoch.getTime()
        )
    ) {

        return {
            color: "#718096",
            icon: "⚪",
            text: "不明"
        };
    }


    const ageHours =
        (
            Date.now() -
            epoch.getTime()
        ) / 3600000;


    if (ageHours < 24) {

        return {
            color: "#16a34a",
            icon: "🟢",
            text: "新鮮"
        };
    }


    if (ageHours < 72) {

        return {
            color: "#ca8a04",
            icon: "🟡",
            text: "やや古い"
        };
    }


    if (ageHours < 168) {

        return {
            color: "#ea580c",
            icon: "🟠",
            text: "古い"
        };
    }


    return {
        color: "#dc2626",
        icon: "🔴",
        text: "要注意"
    };
}



/* =========================================================
   ポップアップ
   ========================================================= */

function popOf(r) {

    const c =
        catOf(r);


    const fresh =
        freshnessOf(
            r.epoch_iso
        );


    return (

        "<b>" +
        r.name +

        "display:inline-block;" +
        "margin:4px 0;" +
        "padding:2px 8px;" +
        "border-radius:10px;" +

        "background:" +
        c[0] +
        ";" +

        "color:white;" +
        "font-size:12px;" +

        "'>" +

        c[1] +

        "</span><br>" +


        "<b>NORAD ID：</b>" +
        r.norad +
        "<br>" +


        "<b>緯度：</b>" +
        r.lat +
        "°<br>" +


        "<b>経度：</b>" +
        r.lon +
        "°<br>" +


        "<b>高度：</b>" +
        r.alt_km +
        " km<br>" +


        "<hr>" +


        "🚀 <b>打上げ日：</b>" +

        formatLaunchDate(
            r.launch_date
        ) +

        "<br>" +


        "📍 <b>打上げ場所：</b>" +

        launchSiteName(
            r.launch_site
        ) +

        "<br>" +


        "🛰 <b>打上げから：</b>" +

        launchAgeOf(
            r.launch_date
        ) +

        "<br>" +


        "<hr>" +


        "<b>TLEエポック：</b>" +
        r.epoch_day +
        "<br>" +


        "<b>エポック日時：</b>" +
        r.epoch_utc +
        "<br>" +


        "<b>経過時間：</b>" +

        ageOf(
            r.epoch_iso
        ) +

        "<br>" +


        "<b>TLE鮮度：</b>" +


        "<span style='" +

        "font-weight:bold;" +

        "color:" +
        fresh.color +
        ";" +

        "'>" +


        fresh.icon +
        " " +
        fresh.text +


        "</span><br>" +


        "<hr>" +


        "<b>分類：</b>" +
        c[1] +
        "<br>" +


        "<b>任務メモ：</b>" +
        c[2]
    );
}



/* =========================================================
   マーカー
   ========================================================= */

const satelliteMarkers = [];


data.forEach(r => {

    const c =
        catOf(r);


    const marker =
        L.circleMarker(

            [
                parseFloat(
                    r.lat
                ),

                parseFloat(
                    r.lon
                )
            ],

            {
                radius: 8,
                color: "#1a202c",
                weight: 1,
                fillColor: c[0],
                fillOpacity: 0.9
            }
        )

        .addTo(map)

        .bindPopup(
            popOf(r),
            {
                maxWidth: 420,
                autoPan: true,
                autoPanPaddingTopLeft: [20, 20],
                autoPanPaddingBottomRight: [20, 20]
            }
        );


    satelliteMarkers.push({

        data: r,
        marker: marker
    });
});



/* =========================================================
   検索用文字列正規化

   TJS-12
   TJS12
   Tjs12
   TJS 12

   全部同じ扱い
   ========================================================= */

function normalizeSearch(value) {

    return String(
        value || ""
    )

    .toUpperCase()

    .replace(
        /[^A-Z0-9]/g,
        ""
    );
}



/* =========================================================
   衛星検索
   ========================================================= */

function searchSatellite() {

    const input =
        document.getElementById(
            "satSearch"
        );


    const result =
        document.getElementById(
            "searchResult"
        );


    const query =
        normalizeSearch(
            input.value.trim()
        );


    if (!query) {

        result.textContent =
            "衛星名かNORAD IDを入力してください";

        return;
    }


    let found =
        satelliteMarkers.find(
            item => {

                const name =
                    normalizeSearch(
                        item.data.name
                    );

                const norad =
                    normalizeSearch(
                        item.data.norad
                    );

                return (
                    name === query ||
                    norad === query
                );
            }
        );


    if (!found) {

        found =
            satelliteMarkers.find(
                item => {

                    const name =
                        normalizeSearch(
                            item.data.name
                        );

                    const norad =
                        normalizeSearch(
                            item.data.norad
                        );

                    return (
                        name.includes(query) ||
                        norad.includes(query)
                    );
                }
            );
    }


    if (!found) {

        result.textContent =
            "❌ 該当する衛星がありません";

        return;
    }


    const r =
        found.data;


    const marker =
        found.marker;


    map.setView(

        [
            parseFloat(
                r.lat
            ),

            parseFloat(
                r.lon
            )
        ],

        5,

        {
            /* アニメーションしながらだとポップアップの自動スクロール(autoPan)が効かず、
               上が地図からはみ出していたため、アニメーションなしで移動する */
            animate: false
        }
    );


    marker.openPopup();


    marker.setRadius(
        14
    );


    setTimeout(

        function() {

            marker.setRadius(
                8
            );
        },

        2500
    );


    result.textContent =
        "✅ " +
        r.name +
        " / NORAD " +
        r.norad;
}



/* =========================================================
   検索ボタン
   ========================================================= */

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(

        "click",

        searchSatellite
    );



/* =========================================================
   Enterでも検索
   ========================================================= */

document
    .getElementById(
        "satSearch"
    )
    .addEventListener(

        "keydown",

        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                searchSatellite();
            }
        }
    );

/* =========================================================
   詳細を開いている間はカテゴリを隠す
   ========================================================= */

map.on(
    "popupopen",

    function() {

        const legendBox =
            document.getElementById(
                "satLegend"
            );


        if (legendBox) {

            legendBox.style.display =
                "none";
        }
    }
);



/* =========================================================
   詳細を閉じたらカテゴリ復活
   ========================================================= */

map.on(
    "popupclose",

    function() {

        const legendBox =
            document.getElementById(
                "satLegend"
            );


        if (legendBox) {

            legendBox.style.display =
                "block";
        }
    }
);
