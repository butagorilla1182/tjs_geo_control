function launchSiteName(code) {

    if (!code) {
        return "不明";
    }

    const key =
        String(code)
            .trim()
            .toUpperCase();

    const name =
        LAUNCH_SITES[key];

    if (name) {
        return (
            name +
            "（" +
            key +
            "）"
        );
    }

    return key;
}



/* =========================================================
   衛星カテゴリ
   ========================================================= */

function catOf(r) {

    const n =
        String(
            r.name || ""
        ).toUpperCase();

    const lat =
        Math.abs(
            parseFloat(
                r.lat || "0"
            )
        );


    if (lat > 3) {

        return [
            "#dd6b20",
            "移動中・傾斜大",
            "GEO付近だが南北に大きく振れている。移動中・静止化途中・傾斜軌道の可能性"
        ];
    }


    if (
        n.includes("TJS") ||
        n.includes("TONGXIN")
    ) {

        return [
            "#2b6cb0",
            "TJS・通信技術試験",
            "中国の通信技術試験衛星系。GEO上の位置と移動を継続監視"
        ];
    }


    return [
        "#718096",
        "未整理",
        "用途未整理。公開情報または自分メモで追記"
    ];
}



/* =========================================================
   打上げ情報
   ========================================================= */

function formatLaunchDate(date) {

    if (!date) {
        return "不明";
    }

    return date.replaceAll(
        "-",
        "/"
    );
}



function launchAgeOf(date) {

    if (!date) {
        return "不明";
    }

    const launch =
        new Date(
            date +
            "T00:00:00Z"
        );


    if (
        Number.isNaN(
            launch.getTime()
        )
    ) {
        return "不明";
    }


    const diff =
        Date.now() -
        launch.getTime();


    if (diff < 0) {
        return "未打上げ";
    }


    const days =
        Math.floor(
            diff / 86400000
        );


    if (days < 365) {
        return (
            days +
            "日"
        );
    }


    const years =
        Math.floor(
            days / 365.2425
        );


    const remainDays =
        Math.floor(
            days -
            years * 365.2425
        );


    return (
        years +
        "年 " +
        remainDays +
        "日"
    );
}



/* =========================================================
   TLE経過時間
   ========================================================= */

function ageOf(epochIso) {

    const epoch =
        new Date(
            epochIso
        );


    if (
        Number.isNaN(
            epoch.getTime()
        )
    ) {
        return "不明";
    }


    let diff =
        Date.now() -
        epoch.getTime();


    const future =
        diff < 0;


    diff =
        Math.abs(
            diff
        );


    const totalMinutes =
        Math.floor(
            diff / 60000
        );


    const days =
        Math.floor(
            totalMinutes / 1440
        );


    const hours =
        Math.floor(
            (
                totalMinutes %
                1440
            ) / 60
        );


    const minutes =
        totalMinutes % 60;


    let text = "";


    if (days > 0) {

        text +=
            days +
            "日 ";
    }


    text +=
        hours +
        "時間" +
        minutes +
        "分";


    return future
        ? "未来 " + text
        : text;
}



/* =========================================================
   TLE鮮度
   ========================================================= */

function freshnessOf(epochIso) {

    const epoch =
        new Date(
            epochIso
        );


    if (
        Number.isNaN(
            epoch.getTime()
        )
    ) {

        return {
            color: "#718096",
            icon: "⚪",
            text: "不明"
        };
    }


    const ageHours =
        (
            Date.now() -
            epoch.getTime()
        ) / 3600000;


    if (ageHours < 24) {

        return {
            color: "#16a34a",
            icon: "🟢",
            text: "新鮮"
        };
    }


    if (ageHours < 72) {

        return {
            color: "#ca8a04",
            icon: "🟡",
            text: "やや古い"
        };
    }


    if (ageHours < 168) {

        return {
            color: "#ea580c",
            icon: "🟠",
            text: "古い"
        };
    }


    return {
        color: "#dc2626",
        icon: "🔴",
        text: "要注意"
    };
}



/* =========================================================

   ========================================================= */

        "color:" +

        "'>" +


        fresh.icon +

        "</span><br>" +


        "<hr>" +

        c[1] +
        "<br>" +


        "<b>任務メモ：</b>" +
        c[2]
    );
}



/* =========================================================
   マーカー
   ========================================================= */

const satelliteMarkers = [];


data.forEach(r => {

    const c =
        catOf(r);


    const marker =
        L.circleMarker(

            [
                parseFloat(
                    r.lat
                ),

                parseFloat(
                    r.lon
                )
            ],

            {
                radius: 8,

                color:
                    "#1a202c",

                weight: 1,

                fillColor:
                    c[0],

                fillOpacity:
                    0.9
            }
        )

        .addTo(map)

        .bindPopup(
            popOf(r)
        );


    satelliteMarkers.push({

        data: r,

        marker: marker
    });
});



/* =========================================================
   検索用文字列正規化

   TJS-12
   TJS12
   Tjs12
   TJS 12

   全部同じ扱い
   ========================================================= */

function normalizeSearch(value) {

    return String(
        value || ""
    )

    .toUpperCase()

    .replace(
        /[^A-Z0-9]/g,
        ""
    );
}



/* =========================================================
   衛星検索
   ========================================================= */

function searchSatellite() {

    const input =
        document.getElementById(
            "satSearch"
        );


    const result =
        document.getElementById(
            "searchResult"
        );


    const raw =
        input.value.trim();


    const query =
        normalizeSearch(
            raw
        );


    if (!query) {

        result.textContent =
            "衛星名かNORAD IDを入力してください";

        return;
    }



    /* -------------------------
       完全一致
       ------------------------- */

    let found =
        satelliteMarkers.find(
            item => {

                const name =
                    normalizeSearch(
                        item.data.name
                    );


                const norad =
                    normalizeSearch(
                        item.data.norad
                    );


                return (
                    name === query ||
                    norad === query
                );
            }
        );



    /* -------------------------
       部分一致
       ------------------------- */

    if (!found) {

        found =
            satelliteMarkers.find(
                item => {

                    const name =
                        normalizeSearch(
                            item.data.name
                        );


                    const norad =
                        normalizeSearch(
                            item.data.norad
                        );


                    return (
                        name.includes(
                            query
                        ) ||

                        norad.includes(
                            query
                        )
                    );
                }
            );
    }



    if (!found) {

        result.textContent =
            "❌ 該当する衛星がありません";

        return;
    }



    const r =
        found.data;


    const marker =
        found.marker;



    /* -------------------------
       衛星位置へ移動
       ------------------------- */

    map.setView(

        [
            parseFloat(
                r.lat
            ),

            parseFloat(
                r.lon
            )
        ],

        5,

        {
            animate: true
        }
    );



    /* -------------------------
       ポップアップ表示
       ------------------------- */

    marker.openPopup();



    /* -------------------------
       マーカー強調
       ------------------------- */

    marker.setRadius(
        14
    );


    setTimeout(

        function() {

            marker.setRadius(
                8
            );
        },

        2500
    );



    result.textContent =
        "✅ " +
        r.name +
        " / NORAD " +
        r.norad;
}



/* =========================================================
   検索ボタン
   ========================================================= */

document
    .getElementById(
        "searchButton"
    )
    .addEventListener(

        "click",

        searchSatellite
    );



/* =========================================================
   Enterでも検索
   ========================================================= */

document
    .getElementById(
        "satSearch"
    )
    .addEventListener(

        "keydown",

        function(event) {

            if (
                event.key ===
                "Enter"
            ) {

                event.preventDefault();

                searchSatellite();
            }
        }
    );

legend.addTo(map);

map.on(
    "popupopen",

    function() {

            document.getElementById(
                "satLegend"

        }

map.on(

);
