function catOf(r) {

    const n = String(r.name || "").toUpperCase();
    const lat = Math.abs(parseFloat(r.lat || "0"));

    if (lat > 3)
        return [
            "#dd6b20",
            "移動中・傾斜大",
            "GEO付近だが南北に大きく振れている。移動中・静止化途中・傾斜軌道の可能性"
        ];

    if (
        n.includes("TJS") ||
        n.includes("TONGXIN")
    )
        return [
            "#2b6cb0",
            "TJS・通信技術試験",
            "中国の通信技術試験衛星系。GEO上の位置と移動を継続監視"
        ];

    if (
        n.includes("CHINASAT") ||
        n.includes("ZHONGXING") ||
        n.includes("ZX-") ||
        n.includes("TIANLIAN") ||
        n.includes("APSTAR")
    )
        return [
            "#c53030",
            "PRC通信・中継",
            "中国系の通信・データ中継衛星候補"
        ];

    if (
        n.includes("LUCH") ||
        n.includes("EXPRESS") ||
        n.includes("EKSPRESS") ||
        n.includes("YAMAL") ||
        n.includes("RADUGA") ||
        n.includes("GARPUN")
    )
        return [
            "#6b46c1",
            "CIS/Russia系",
            "ロシア・旧ソ連系の通信またはデータ中継衛星候補"
        ];

    if (
        n.includes("ELEKTRO") ||
        n.includes("HIMAWARI") ||
        n.includes("GOES") ||
        n.includes("METEOSAT") ||
        n.includes("FENGYUN") ||
        n.includes("FY-")
    )
        return [
            "#2f855a",
            "気象・観測",
            "静止気象・地球観測系"
        ];

    return [
        "#718096",
        "未整理",
        "用途未整理。公開情報または自分メモで追記"
    ];
}


function ageOf(epochIso) {

    const epoch = new Date(epochIso);

    if (Number.isNaN(epoch.getTime())) {
        return "不明";
    }

    let diff = Date.now() - epoch.getTime();

    const future = diff < 0;

    diff = Math.abs(diff);

    const totalMinutes =
        Math.floor(diff / 60000);

    const days =
        Math.floor(totalMinutes / 1440);

    const hours =
        Math.floor((totalMinutes % 1440) / 60);

    const minutes =
        totalMinutes % 60;

    let text = "";

    if (days > 0) {
        text += days + "日 ";
    }

    text += hours + "時間" + minutes + "分";

    if (future) {
        return "未来 " + text;
    }

    return text;
}

    const c = catOf(r);

        "<hr>" +

        "<b>分類：</b>" +
        c[1] + "<br>" +

        "<b>任務メモ：</b>" +
        c[2]
    );
}
