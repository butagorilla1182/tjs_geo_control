name: Update TJS GEO data

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: write

jobs:
  update-tjs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install skyfield

      - name: Download latest GEO and GPZ TLE from CelesTrak
        run: |
          set -euo pipefail

          curl -fL "https://celestrak.org/NORAD/elements/gp.php?GROUP=GEO&FORMAT=TLE" -o geo_group.tle
          curl -fL "https://celestrak.org/NORAD/elements/gp.php?SPECIAL=GPZ&FORMAT=TLE" -o gpz.tle

          cat geo_group.tle gpz.tle > geo.tle

      - name: Generate TJS CSV and HTML
        run: |
          python make_tjs_csv.py
          python make_tjs_html.py
          python make_tjs_map.py

      - name: Commit updated TJS files
        run: |
          TZ=Asia/Tokyo date '+%Y/%m/%d %H:%M:%S JST' > last_updated.txt
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add geo.tle tjs.tle tjs_clean.tle tjs_geo.csv tjs_geo.html tjs_map.html last_updated.txt
          git commit -m "Update TJS GEO data" || echo "No changes to commit"
          git push