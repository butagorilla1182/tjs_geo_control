name: Update TJS GEO data  on:   workflow_dispatch:   schedule:     - cron: "0 */6 * * *"  permissions:   contents: write  jobs:   update-tjs:     runs-on: ubuntu-latest      steps:       - name: Checkout repository         uses: actions/checkout@v4        - name: Set up Python         uses: actions/setup-python@v5         with:           python-version: "3.x"        - name: Download latest GEO TLE from CelesTrak         run: |           curl -L "https://celestrak.org/NORAD/elements/gp.php?GROUP=geo&FORMAT=tle" -o geo.tle        - name: Generate TJS CSV and HTML         run: |           python make_tjs_csv.py           python make_tjs_html.py           python make_tjs_map.py        - name: Commit updated TJS files         run: |           git config user.name "github-actions[bot]"           git config user.email "github-actions[bot]@users.noreply.github.com"           git add geo.tle tjs.tle tjs_clean.tle tjs_geo.csv tjs_geo.html tjs_map.html           git commit -m "Update TJS GEO data" || echo "No changes to commit"           git push
